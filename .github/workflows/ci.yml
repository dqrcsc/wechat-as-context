name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Typecheck & Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Verify test isolation against synthetic deployment
        run: bun run test:isolation

      - name: Run test suite
        run: bun run test

  offline-ca:
    name: Offline yt-dlp certificate loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test-only dependencies
        run: |
          python -m venv "$RUNNER_TEMP/wxctx-ca"
          "$RUNNER_TEMP/wxctx-ca/bin/python" -m pip install --isolated --index-url https://pypi.org/simple -r tests/integration/youtube-ca-requirements.txt
      - name: Verify CA stores without network or application data
        run: '"$RUNNER_TEMP/wxctx-ca/bin/python" tests/integration/youtube_ca_test.py'
